<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirm Investment</title>

  <link rel="stylesheet" href="style.css"/>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
    }

    .confirm-box {
      max-width: 460px;
      margin: 60px auto;
      background: linear-gradient(180deg, #161a22, #0f131a);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .confirm-box h2 {
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }

    .row span:last-child {
      color: #b08d2a;
      font-weight: 600;
    }

    .highlight {
      color: #b08d2a;
      font-weight: bold;
    }

    .confirm-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #b08d2a, #d6b146);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
    }

    .confirm-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="site-header"></div>
<script type="module" src="header.js"></script>

<div class="confirm-box">
  <h2>Investment Preview</h2>
  <div class="subtitle">Review your investment details before confirming</div>

  <div class="row"><span>Plan</span><span id="plan">...</span></div>
  <div class="row"><span>ROI</span><span id="roi">...</span></div>
  <div class="row"><span>Duration</span><span id="duration">...</span></div>
  <div class="row"><span>Amount</span><span id="amount">...</span></div>

  <div class="row"><span>Expected Return</span><span id="return">...</span></div>
  <div class="row"><span>Start Date</span><span id="start">...</span></div>
  <div class="row"><span>Maturity Date</span><span id="maturity">...</span></div>

  <button class="confirm-btn" id="confirmBtn">
    Confirm Investment
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
  authDomain: "crowncapital-invest.firebaseapp.com",
  projectId: "crowncapital-invest",
  storageBucket: "crowncapital-invest.firebasestorage.app",
  messagingSenderId: "9373579357",
  appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* URL DATA */
const params = new URLSearchParams(window.location.search);

const plan = params.get("plan");
const roi = Number(params.get("roi") || 0);
const duration = Number(params.get("duration") || 0);
const amount = Number(params.get("amount") || 0);
const paid = params.get("paid");

/* PAYMENT CHECK */
if (!paid) {
  document.querySelector(".confirm-box").innerHTML =
    "<h2>Payment Required</h2><p style='text-align:center;color:#aaa'>Please complete payment before confirming investment.</p>";
}

/* DATES + CALCULATION */
const startDate = new Date();
const maturityDate = new Date();
maturityDate.setDate(startDate.getDate() + duration);

const expectedReturn = amount + (amount * roi / 100);

/* RENDER */
document.getElementById("plan").innerText = plan;
document.getElementById("roi").innerText = roi + "%";
document.getElementById("duration").innerText = duration + " days";
document.getElementById("amount").innerText = "$" + amount.toFixed(2);
document.getElementById("return").innerText = "$" + expectedReturn.toFixed(2);
document.getElementById("start").innerText = startDate.toDateString();
document.getElementById("maturity").innerText = maturityDate.toDateString();

let userRef = null;

/* AUTH */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  userRef = doc(db, "users", user.uid);
});

/* CONFIRM */
document.getElementById("confirmBtn").addEventListener("click", async () => {

  if (!userRef) return;

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  await updateDoc(userRef, {
    activePlan: plan,
    planROI: roi,
    planDuration: duration,
    planAmount: amount,
    expectedReturn: expectedReturn,
    planStart: Date.now(),
    planMaturity: maturityDate.getTime()
  });

  btn.innerText = "Confirmed";

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1200);
});
</script>

</body>
</html>
