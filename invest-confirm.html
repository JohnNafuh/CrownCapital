<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirm Investment</title>

  <link rel="stylesheet" href="style.css"/>

  <style>
    .confirm-box {
      max-width: 420px;
      margin: 60px auto;
      background: linear-gradient(180deg, #161a22, #0f131a);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      text-align: center;
    }

    .detail {
      color: rgba(255,255,255,0.7);
      margin: 8px 0;
      font-size: 14px;
    }

    .confirm-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #b08d2a, #d6b146);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
    }

    .confirm-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 22px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255,0,0,0.08);
      border: 1px solid rgba(255,0,0,0.2);
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<div class="site-header"></div>
<script type="module" src="header.js"></script>

<!-- MAIN UI -->
<div class="confirm-box" id="box">
  <h2>Confirm Investment</h2>

  <p class="detail" id="plan">Plan: ...</p>
  <p class="detail" id="roi">ROI: ...</p>
  <p class="detail" id="duration">Duration: ... days</p>

  <button class="confirm-btn" id="confirmBtn">
    Confirm Investment
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
  authDomain: "crowncapital-invest.firebaseapp.com",
  projectId: "crowncapital-invest",
  storageBucket: "crowncapital-invest.firebasestorage.app",
  messagingSenderId: "9373579357",
  appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* URL DATA */
const params = new URLSearchParams(window.location.search);

const plan = params.get("plan");
const roi = params.get("roi");
const duration = params.get("duration");
const paid = params.get("paid");

/* ❌ BLOCK ACCESS IF NOT PAID */
if (!paid) {
  document.body.innerHTML = `
    <div class="error-box">
      <h2>Payment Required</h2>
      <p>Please complete payment before confirming investment.</p>
    </div>
  `;
  throw new Error("Payment required");
}

/* validate params */
if (!plan || !roi || !duration) {
  document.body.innerHTML = `
    <div class="error-box">
      <h2>Invalid Request</h2>
      <p>Missing investment data.</p>
    </div>
  `;
  throw new Error("Invalid params");
}

/* fill UI */
document.getElementById("plan").innerText = "Plan: " + plan;
document.getElementById("roi").innerText = "ROI: " + roi + "%";
document.getElementById("duration").innerText = "Duration: " + duration + " days";

let userRef = null;

/* AUTH CHECK */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  userRef = doc(db, "users", user.uid);
});

/* CONFIRM INVESTMENT */
document.getElementById("confirmBtn").addEventListener("click", async () => {

  if (!userRef) return;

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  try {
    await updateDoc(userRef, {
      activePlan: plan,
      planROI: Number(roi),
      planDuration: Number(duration),
      planStart: Date.now()
    });

    btn.innerText = "Success!";

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1200);

  } catch (err) {
    console.error(err);
    btn.innerText = "Try Again";
    btn.disabled = false;
  }
});
</script>

</body>
</html>
