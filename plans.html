<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Plans - CrownCapital</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- SAFE CARD UPGRADE STYLES ONLY -->
  <style>
    .plan-card {
      transition: 0.3s ease;
      text-decoration: none;
    }

    .plan-card:hover {
      transform: translateY(-6px);
      border: 1px solid #b08d2a;
    }

    .plan-card h3 {
      margin-bottom: 10px;
    }

    .plan-price {
      font-size: 24px;
      color: #b08d2a;
      font-weight: bold;
      margin: 10px 0;
    }

    .plan-desc {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- SYSTEM B HEADER -->
  <div class="site-header"></div>

  <!-- PAGE TITLE -->
  <section class="hero" style="padding: 50px 20px 30px 20px;">
    <h2>Investment Plans</h2>
    <p>Choose a plan that fits your financial goals</p>
  </section>

  <!-- PLANS (UNCHANGED STRUCTURE) -->
  <section class="features">

    <a href="#" class="card plan-card">
      <h3>Starter Plan</h3>
      <p class="plan-price">5% ROI</p>
      <small class="plan-desc">Low risk • Beginner friendly</small>
    </a>

    <a href="#" class="card plan-card">
      <h3>Pro Plan</h3>
      <p class="plan-price">10% ROI</p>
      <small class="plan-desc">Balanced growth</small>
    </a>

    <a href="#" class="card plan-card">
      <h3>Elite Plan</h3>
      <p class="plan-price">20% ROI</p>
      <small class="plan-desc">High return • High reward</small>
    </a>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 CrownCapital. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="script.js"></script>
  <script src="header.js"></script>

</body>
</html>
