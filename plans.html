<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Plans - CrownCapital</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- PREMIUM BUTTON UPGRADE -->
  <style>
    .plan-card {
      transition: 0.3s ease;
      text-decoration: none;
      position: relative;
    }

    .plan-card:hover {
      transform: translateY(-6px);
      border: 1px solid #b08d2a;
    }

    .plan-price {
      font-size: 24px;
      color: #b08d2a;
      font-weight: bold;
      margin: 10px 0;
    }

    .plan-desc {
      color: #aaa;
      font-size: 14px;
    }

    /* =========================
       INVEST BUTTON UPGRADE
    ========================= */

    .invest-btn {
      margin-top: 14px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(176,141,42,0.35);
      background: linear-gradient(180deg, #b08d2a, #8f7322);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    .invest-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(176,141,42,0.25);
    }

    .invest-btn:active {
      transform: scale(0.98);
    }

    /* subtle shine sweep */
    .invest-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: rgba(255,255,255,0.25);
      transform: skewX(-20deg);
      transition: 0.5s;
    }

    .invest-btn:hover::after {
      left: 120%;
    }
  </style>
</head>

<body>

<div class="site-header"></div>
<script type="module" src="header.js"></script>

<!-- TITLE -->
<section class="hero" style="padding: 50px 20px 30px 20px;">
  <h2>Investment Plans</h2>
  <p>Choose a plan that fits your financial goals</p>
</section>

<!-- PLANS -->
<section class="features">

  <a href="#" class="card plan-card">
    <h3>Starter Plan</h3>
    <p class="plan-price">5% ROI</p>
    <small class="plan-desc">Low risk • Beginner friendly</small>

    <button class="invest-btn"
      onclick="event.preventDefault(); investPlan('Starter Plan', 5, 7)">
      Invest Now
    </button>
  </a>

  <a href="#" class="card plan-card">
    <h3>Pro Plan</h3>
    <p class="plan-price">10% ROI</p>
    <small class="plan-desc">Balanced growth</small>

    <button class="invest-btn"
      onclick="event.preventDefault(); investPlan('Pro Plan', 10, 14)">
      Invest Now
    </button>
  </a>

  <a href="#" class="card plan-card">
    <h3>Elite Plan</h3>
    <p class="plan-price">20% ROI</p>
    <small class="plan-desc">High return • High reward</small>

    <button class="invest-btn"
      onclick="event.preventDefault(); investPlan('Elite Plan', 20, 30)">
      Invest Now
    </button>
  </a>

</section>

<footer>
  <p>© 2026 CrownCapital. All rights reserved.</p>
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
  authDomain: "crowncapital-invest.firebaseapp.com",
  projectId: "crowncapital-invest",
  storageBucket: "crowncapital-invest.firebasestorage.app",
  messagingSenderId: "9373579357",
  appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("Login required");
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

window.investPlan = async function(planName, roi, duration) {
  if (!currentUser) return;

  const userRef = doc(db, "users", currentUser.uid);

  await updateDoc(userRef, {
    activePlan: planName,
    planROI: roi,
    planDuration: duration,
    planStart: Date.now()
  });

  alert(`${planName} activated successfully!`);
  window.location.href = "dashboard.html";
};
</script>

</body>
</html>
