<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - CrownCapital</title>

  <link rel="stylesheet" href="./style.css">

  <!-- 🔒 FIREBASE SCRIPT -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    /* =========================
       ANIMATION ENGINE
    ========================= */
    function animateValue(el, start, end, duration) {
      let startTimestamp = null;

      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;

        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const value = progress * (end - start) + start;

        el.innerText = "$" + value.toFixed(2);

        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };

      window.requestAnimationFrame(step);
    }

    /* =========================
       FIREBASE CONFIG
    ========================= */
    const firebaseConfig = {
      apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
      authDomain: "crowncapital-invest.firebaseapp.com",
      projectId: "crowncapital-invest",
      storageBucket: "crowncapital-invest.firebasestorage.app",
      messagingSenderId: "9373579357",
      appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* =========================
       AUTH + WALLET LOAD
    ========================= */
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          const data = snap.data();

          const balanceEl = document.getElementById("balance");
          const profitEl = document.getElementById("profit");
          const planEl = document.getElementById("activePlan");

          animateValue(balanceEl, 0, data.balance ?? 0, 900);
          animateValue(profitEl, 0, data.profit ?? 0, 900);

          planEl.innerText = data.activePlan ?? "None";

          /* glow effect */
          document.querySelectorAll(".card").forEach(card => {
            card.classList.add("updated");
            setTimeout(() => card.classList.remove("updated"), 1200);
          });
        }

      } catch (err) {
        console.error("Firestore error:", err);
      }
    });

    /* =========================
       LOGOUT
    ========================= */
    window.logout = function () {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };

  </script>

</head>

<body>

  <!-- HEADER -->
  <div class="site-header"></div>
  <script type="module" src="header.js"></script>

  <!-- DASHBOARD HERO -->
  <section class="hero" style="
    padding: 40px 20px 20px 20px;
    text-align: center;
    background: radial-gradient(circle at top, #1a1d24, #0f1115);
  ">
    <h2 style="margin:0; font-size:22px;">Dashboard</h2>
    <p style="margin-top:8px; color:rgba(255,255,255,0.6); font-size:13px;">
      Overview of your account activity and investments
    </p>

    <button onclick="logout()" style="
      margin-top: 15px;
      padding: 10px 18px;
      background: #b08d2a;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    ">
      Logout
    </button>
  </section>

  <!-- WALLET CARDS -->
  <section class="features">

    <div class="card">
      <h3>Wallet Balance</h3>
      <p id="balance">$0.00</p>
    </div>

    <div class="card">
      <h3>Profit</h3>
      <p id="profit">$0.00</p>
    </div>

    <div class="card">
      <h3>Active Plan</h3>
      <p id="activePlan">None</p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 CrownCapital. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="header.js"></script>

</body>
</html>
