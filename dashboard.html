<!DOCTYPE html>

    <div class="card">

    <div class="card">
      <h3>Profit Earned</h3>
      <p style="font-size:26px; color:#b08d2a; font-weight:bold;">
        $0.00
      </p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 CrownCapital. All rights reserved.</p>
  </footer>

  <!-- SYSTEM B SCRIPTS -->
  <script src="script.js"></script>
