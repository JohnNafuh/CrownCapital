<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - CrownCapital</title>

  <link rel="stylesheet" href="./style.css">

  <!-- 🔒 FIREBASE AUTH + FIRESTORE SCRIPT -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    /* =========================
       FIREBASE CONFIG
    ========================= */
    const firebaseConfig = {
      apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
      authDomain: "crowncapital-invest.firebaseapp.com",
      projectId: "crowncapital-invest",
      storageBucket: "crowncapital-invest.firebasestorage.app",
      messagingSenderId: "9373579357",
      appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* =========================
       🔒 AUTH + WALLET LOAD
    ========================= */
    onAuthStateChanged(auth, async (user) => {

      const overlay = document.getElementById("loginOverlay");

      if (!overlay) return;

      if (!user) {
        overlay.style.display = "flex";
        return;
      }

      overlay.style.display = "none";

      // 🔥 LOAD USER WALLET
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      if (snap.exists()) {
        const data = snap.data();

        document.getElementById("balance").innerText = "$" + data.balance;
        document.getElementById("profit").innerText = "$" + data.profit;
      }
    });

    /* =========================
       🔑 LOGIN
    ========================= */
    window.login = function () {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch(e => alert(e.message));
    };

    /* =========================
       🆕 SIGNUP
    ========================= */
    window.signup = function () {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .catch(e => alert(e.message));
    };

    /* =========================
       🚪 LOGOUT
    ========================= */
    window.logout = function () {
      signOut(auth);
    };

  </script>

</head>

<body>

  
  <!-- SYSTEM HEADER -->
  <div class="site-header"></div>

  <!-- DASHBOARD HERO -->
  <section class="hero">

    <h2>Dashboard</h2>
    <p>Welcome back, your investment overview is below</p>

    <button onclick="logout()" style="
      margin-top: 15px;
      padding: 10px 18px;
      background: #b08d2a;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    ">
      Logout
    </button>

  </section>

  <!-- DASHBOARD STATS -->
  <section class="features">

    <div class="card">
      <h3>Wallet Balance</h3>
      <p id="balance">$0.00</p>
    </div>

    <div class="card">
      <h3>Profit</h3>
      <p id="profit">$0.00</p>
    </div>

    <div class="card">
      <h3>Active Investment</h3>
      <p style="font-size:26px; color:#b08d2a; font-weight:bold;">$0.00</p>
    </div>

  </section>

  <footer>
    <p>© 2026 CrownCapital. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="header.js"></script>

</body>
</html>
