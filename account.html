<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account - CrownCapital</title>

  <link rel="stylesheet" href="./style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtE70AdxT2k3hVzwxA4MlDM5pvSNJS6Y8",
      authDomain: "crowncapital-invest.firebaseapp.com",
      projectId: "crowncapital-invest",
      storageBucket: "crowncapital-invest.firebasestorage.app",
      messagingSenderId: "9373579357",
      appId: "1:9373579357:web:6c86ceeb96d4273137b5b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("email").innerText = user.email;
    });

    window.logout = function () {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };
  </script>
</head>

<body>

<!-- HEADER -->
<div class="site-header"></div>
<script type="module" src="header.js"></script>

<!-- ACCOUNT HEADER -->
<section class="hero" style="
  padding: 60px 20px 30px;
  text-align: center;
  background: radial-gradient(circle at top, #1a1d24, #0b0d12);
">

  <div style="font-size:12px; letter-spacing:2px; color:rgba(255,255,255,0.5);">
    ACCOUNT CENTER
  </div>

  <h1 style="margin:10px 0;">My Profile</h1>

  <p id="email" style="color:rgba(255,255,255,0.6); font-size:13px;"></p>

  <button onclick="logout()" class="btn" style="margin-top:18px;">
    Logout
  </button>
</section>

<!-- ACCOUNT ACTIONS -->
<section class="features">

  <div class="card">
    <h3>Deposit Funds</h3>
    <p style="font-size:13px; color:rgba(255,255,255,0.6);">
      Add money to activate investment plans
    </p>
    <button class="btn">Deposit</button>
  </div>

  <div class="card">
    <h3>Withdraw</h3>
    <p style="font-size:13px; color:rgba(255,255,255,0.6);">
      Request payout from earnings
    </p>
    <button class="btn">Withdraw</button>
  </div>

  <div class="card">
    <h3>Security</h3>
    <p style="font-size:13px; color:rgba(255,255,255,0.6);">
      Manage login access & protection
    </p>
    <button class="btn">Manage</button>
  </div>

</section>

<footer>
  <p>© 2026 CrownCapital. All rights reserved.</p>
</footer>

</body>
</html>
